<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HR Attrition AI — Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.4s ease;
        }

        body.light-mode {
            background: linear-gradient(135deg, #e8eaf6, #c5cae9, #e3f2fd);
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 100;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.2);
            transform: rotate(20deg) scale(1.1);
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }
        body.light-mode .theme-toggle {
            border-color: rgba(0,0,0,0.15);
            background: rgba(255,255,255,0.7);
            color: #333;
        }

        /* Login Wrapper */
        .login-wrapper {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Card */
        .login-card {
            width: 420px;
            padding: 48px 42px;
            border-radius: 24px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1);
        }

        body.light-mode .login-card {
            background: rgba(255,255,255,0.88);
            border-color: rgba(102,126,234,0.15);
            box-shadow: 0 25px 60px rgba(102,126,234,0.15);
        }

        @keyframes slideUp {
            from { opacity:0; transform:translateY(50px) scale(0.95); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }

        .login-card.shake { animation: shake 0.5s ease; }
        @keyframes shake {
            0%,100% { transform:translateX(0); }
            20%      { transform:translateX(-12px); }
            40%      { transform:translateX(12px); }
            60%      { transform:translateX(-8px); }
            80%      { transform:translateX(8px); }
        }

        /* Logo */
        .logo-circle {
            width: 76px; height: 76px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px; color: #fff;
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,100% { box-shadow: 0 8px 25px rgba(102,126,234,0.5); }
            50%      { box-shadow: 0 8px 40px rgba(102,126,234,0.9); }
        }

        .login-title {
            color: #fff;
            font-size: 1.6rem; font-weight: 700;
            text-align: center; margin-bottom: 4px;
        }
        .login-subtitle {
            color: rgba(255,255,255,0.55);
            font-size: 0.83rem;
            text-align: center;
            margin-bottom: 32px;
        }
        body.light-mode .login-title   { color: #1a1a2e; }
        body.light-mode .login-subtitle { color: #718096; }

        /* Input */
        .input-wrap {
            position: relative;
            margin-bottom: 16px;
        }
        .input-wrap .inp-icon {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 14px; z-index: 2;
            transition: color 0.3s;
            pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            padding: 13px 44px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-wrap input::placeholder { color: rgba(255,255,255,0.35); }
        .input-wrap input:focus {
            border-color: #667eea;
            background: rgba(102,126,234,0.12);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }
        .input-wrap:focus-within .inp-icon { color: #667eea; }

        body.light-mode .input-wrap input {
            background: rgba(102,126,234,0.06);
            border-color: rgba(102,126,234,0.2);
            color: #2d3748;
        }
        body.light-mode .input-wrap input::placeholder { color: #a0aec0; }
        body.light-mode .input-wrap .inp-icon { color: #a0aec0; }
        body.light-mode .input-wrap:focus-within .inp-icon { color: #667eea; }
        body.light-mode .input-wrap input:focus {
            border-color: #667eea;
            background: rgba(102,126,234,0.08);
            color: #2d3748;
        }

        /* Eye toggle */
        .eye-toggle {
            position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255,255,255,0.35);
            font-size: 14px;
            transition: color 0.3s;
        }
        .eye-toggle:hover { color: #667eea; }
        body.light-mode .eye-toggle { color: #a0aec0; }

        /* Remember */
        .remember-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 24px;
        }
        .remember-row input[type="checkbox"] { accent-color: #667eea; width: 15px; height: 15px; cursor: pointer; }
        .remember-row label { color: rgba(255,255,255,0.6); font-size: 0.83rem; cursor: pointer; }
        body.light-mode .remember-row label { color: #718096; }

        /* Login Button */
        .btn-login {
            width: 100%; padding: 13px;
            border-radius: 12px; border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; font-weight: 600;
            font-family: 'Poppins', sans-serif;
            font-size: 0.97rem; cursor: pointer;
            transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .btn-login::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s;
        }
        .btn-login:hover::before { left: 100%; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(102,126,234,0.5); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* Alerts */
        .alert { border-radius: 10px; font-size: 0.85rem; }
        .alert-danger  { background: rgba(220,53,69,0.18);  color: #ff8a95; border: 1px solid rgba(220,53,69,0.3); }
        .alert-success { background: rgba(40,167,69,0.18);  color: #6fcf97; border: 1px solid rgba(40,167,69,0.3); }
        .alert-info    { background: rgba(23,162,184,0.18); color: #7dd3e0; border: 1px solid rgba(23,162,184,0.3); }
    </style>
</head>
<body>

<div id="particles-js"></div>

<!-- Theme Toggle -->
<button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
    <i class="fas fa-moon" id="themeIcon"></i>
</button>

<div class="login-wrapper">
    <div class="login-card" id="loginCard">

        <div class="logo-circle">
            <i class="fas fa-brain"></i>
        </div>
        <h2 class="login-title">HR Attrition AI</h2>
        <p class="login-subtitle">Enterprise Analytics Platform</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'info' }} alert-dismissible fade show mb-3">
                        <i class="fas fa-{{ 'times-circle' if category == 'error' else 'check-circle' if category == 'success' else 'info-circle' }} me-2"></i>
                        {{ message }}
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm" onsubmit="showLoader()">

            <div class="input-wrap">
                <i class="fas fa-user inp-icon"></i>
                <input type="text" name="username" placeholder="Username" required autocomplete="username">
            </div>

            <div class="input-wrap">
                <i class="fas fa-lock inp-icon"></i>
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                <span class="eye-toggle" onclick="togglePassword()">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </span>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember Me</label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText"><i class="fas fa-sign-in-alt me-2"></i>Sign In</span>
                <span id="loader" class="d-none">
                    <span class="spinner-border spinner-border-sm me-2"></span>Authenticating...
                </span>
            </button>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword() {
    const pwd  = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

function showLoader() {
    document.getElementById('btnText').classList.add('d-none');
    document.getElementById('loader').classList.remove('d-none');
    document.getElementById('loginBtn').disabled = true;
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const icon = document.getElementById('themeIcon');
    const isLight = document.body.classList.contains('light-mode');
    icon.className = isLight ? 'fas fa-sun' : 'fas fa-moon';
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

// Restore saved theme
if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('themeIcon').className = 'fas fa-sun';
}

// Shake on error
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}{% for category, message in messages %}{% if category == 'error' %}
document.getElementById('loginCard').classList.add('shake');
setTimeout(() => document.getElementById('loginCard').classList.remove('shake'), 600);
{% endif %}{% endfor %}{% endif %}
{% endwith %}

// Particles
particlesJS('particles-js', {
    particles: {
        number: { value: 65, density: { enable: true, value_area: 800 } },
        color: { value: ['#667eea', '#764ba2', '#ffffff'] },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: true, anim: { enable: true, speed: 1, opacity_min: 0.1 } },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#667eea', opacity: 0.25, width: 1 },
        move: { enable: true, speed: 1.5, direction: 'none', random: true, out_mode: 'out' }
    },
    interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' } },
        modes: { grab: { distance: 140, line_linked: { opacity: 0.5 } }, push: { particles_nb: 3 } }
    }
});
</script>
</body>
</html>
