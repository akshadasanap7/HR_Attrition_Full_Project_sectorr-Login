<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HR Attrition Prediction - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Particles JS -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #0f2027;
    overflow: hidden;
}

#particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.login-wrapper {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-card {
    width: 400px;
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    animation: fadeIn 1s ease;
    transition: 0.3s;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Shake Effect */
.login-card.shake {
    animation: shake 0.4s;
}

@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
}

.logo-circle {
    width: 70px;
    height: 70px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
    margin-bottom: 15px;
    font-size: 28px;
    color: #2575fc;
}

.title, .subtitle {
    color: white;
}

.input-group-custom {
    position: relative;
    margin-bottom: 20px;
}

.input-group-custom i {
    position: absolute;
    top: 50%;
    left: 15px;
    transform: translateY(-50%);
    color: #aaa;
}

.input-group-custom input {
    width: 100%;
    padding: 12px 40px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: white;
}

.input-group-custom input:focus {
    box-shadow: 0 0 15px #2575fc;
}

.toggle-password {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #ccc;
}

.btn-login {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(45deg, #2575fc, #6a11cb);
    color: white;
    font-weight: bold;
    transition: 0.3s;
}

.btn-login:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

/* Theme Toggle */
.theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    cursor: pointer;
    color: white;
    font-size: 20px;
}

/* Light Mode */
body.light-mode {
    background: #f4f6f9;
}

body.light-mode .login-card {
    background: rgba(255,255,255,0.9);
}

body.light-mode .title,
body.light-mode .subtitle {
    color: #333;
}

body.light-mode .input-group-custom input {
    background: #eee;
    color: #333;
}

        }
    </style>
</head>

<body>

<div id="particles-js"></div>

<!-- Dark/Light Toggle -->
<div class="theme-toggle" onclick="toggleTheme()">
    <i class="fas fa-moon"></i>
</div>

<div class="login-wrapper">
    <div class="login-card" id="loginCard">

        <div class="text-center mb-4">
            <div class="logo-circle">
                <i class="fas fa-chart-line"></i>
            </div>
            <h2 class="title">HR Attrition Prediction</h2>
            <p class="subtitle">Enterprise Analytics Platform</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'info' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" onsubmit="showLoader()">

            <div class="input-group-custom">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-group-custom">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword()">
                    <i class="fas fa-eye"></i>
                </span>
            </div>

            <div class="form-check text-start mb-3 text-light">
                <input class="form-check-input" type="checkbox" name="remember">
                <label class="form-check-label">
                    Remember Me
                </label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">
                    <i class="fas fa-sign-in-alt me-2"></i> Sign In
                </span>
                <span id="loader" class="spinner-border spinner-border-sm d-none"></span>
            </button>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* Password Toggle */
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.querySelector(".toggle-password i");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        password.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
}

/* Loading Animation */
function showLoader() {
    document.getElementById("btnText").classList.add("d-none");
    document.getElementById("loader").classList.remove("d-none");
}

/* Theme Toggle */
function toggleTheme() {
    document.body.classList.toggle("light-mode");
    const icon = document.querySelector(".theme-toggle i");
    icon.classList.toggle("fa-moon");
    icon.classList.toggle("fa-sun");
}

/* Particles */
particlesJS("particles-js", {
    particles: {
        number: { value: 60 },
        size: { value: 3 },
        move: { speed: 2 },
        line_linked: { enable: true },
        color: { value: "#ffffff" }
    }
});
</script>

</body>
</html>
