<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HR Attrition Prediction - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            overflow: hidden;
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 420px;
            padding: 45px 40px;
            border-radius: 24px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card.shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-12px); }
            40%      { transform: translateX(12px); }
            60%      { transform: translateX(-8px); }
            80%      { transform: translateX(8px); }
        }

        .logo-circle {
            width: 75px; height: 75px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
            font-size: 30px; color: white;
            box-shadow: 0 8px 25px rgba(102,126,234,0.5);
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%,100% { box-shadow: 0 8px 25px rgba(102,126,234,0.5); }
            50%      { box-shadow: 0 8px 40px rgba(102,126,234,0.9); }
        }

        .login-title { color: #fff; font-size: 1.6rem; font-weight: 700; text-align: center; }
        .login-subtitle { color: rgba(255,255,255,0.6); font-size: 0.85rem; text-align: center; margin-bottom: 28px; }

        .input-group-custom {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group-custom .icon {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px; z-index: 2;
            transition: color 0.3s;
        }

        .input-group-custom input {
            width: 100%;
            padding: 13px 42px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.1);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group-custom input::placeholder { color: rgba(255,255,255,0.4); }

        .input-group-custom input:focus {
            border-color: #667eea;
            background: rgba(102,126,234,0.15);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }

        .input-group-custom input:focus + .icon,
        .input-group-custom:focus-within .icon { color: #667eea; }

        .toggle-password {
            position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%);
            cursor: pointer; color: rgba(255,255,255,0.4);
            font-size: 14px; transition: color 0.3s;
        }
        .toggle-password:hover { color: #667eea; }

        .remember-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 22px;
        }
        .remember-row input[type="checkbox"] { accent-color: #667eea; width: 16px; height: 16px; }
        .remember-row label { color: rgba(255,255,255,0.7); font-size: 0.85rem; cursor: pointer; }

        .btn-login {
            width: 100%; padding: 13px;
            border-radius: 12px; border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; font-weight: 600;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem; cursor: pointer;
            transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before { left: 100%; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(102,126,234,0.5); }
        .btn-login:active { transform: translateY(0); }

        .theme-toggle {
            position: fixed; top: 20px; right: 20px;
            z-index: 100; cursor: pointer;
            width: 42px; height: 42px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px;
            transition: all 0.3s;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.2); transform: rotate(20deg); }

        .credentials-hint {
            margin-top: 20px;
            padding: 12px 15px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .credentials-hint p { color: rgba(255,255,255,0.5); font-size: 0.75rem; margin: 0 0 6px; }
        .cred-item { display: flex; justify-content: space-between; }
        .cred-item span { color: rgba(255,255,255,0.7); font-size: 0.78rem; }
        .cred-item .badge-role {
            font-size: 0.68rem; padding: 2px 8px;
            border-radius: 20px; font-weight: 600;
        }
        .badge-admin { background: rgba(220,53,69,0.3); color: #ff6b7a; border: 1px solid rgba(220,53,69,0.4); }
        .badge-user  { background: rgba(102,126,234,0.3); color: #a0b4ff; border: 1px solid rgba(102,126,234,0.4); }

        /* Light mode */
        body.light-mode {
            background: linear-gradient(135deg, #e8eaf6, #c5cae9, #e3f2fd);
        }
        body.light-mode .login-card {
            background: rgba(255,255,255,0.85);
            border-color: rgba(0,0,0,0.08);
        }
        body.light-mode .login-title { color: #1a1a2e; }
        body.light-mode .login-subtitle { color: #666; }
        body.light-mode .input-group-custom input {
            background: rgba(0,0,0,0.05);
            border-color: rgba(0,0,0,0.12);
            color: #333;
        }
        body.light-mode .input-group-custom input::placeholder { color: #999; }
        body.light-mode .input-group-custom .icon { color: #999; }
        body.light-mode .remember-row label { color: #555; }
        body.light-mode .credentials-hint { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }
        body.light-mode .credentials-hint p { color: #888; }
        body.light-mode .cred-item span { color: #555; }
        body.light-mode .theme-toggle { color: #333; background: rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.12); }

        .alert { border-radius: 10px; font-size: 0.88rem; border: none; }
        .alert-danger  { background: rgba(220,53,69,0.2);  color: #ff8a95; border: 1px solid rgba(220,53,69,0.3); }
        .alert-success { background: rgba(40,167,69,0.2);  color: #6fcf97; border: 1px solid rgba(40,167,69,0.3); }
        .alert-info    { background: rgba(23,162,184,0.2); color: #7dd3e0; border: 1px solid rgba(23,162,184,0.3); }
    </style>
</head>
<body>

<div id="particles-js"></div>

<div class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
    <i class="fas fa-moon" id="themeIcon"></i>
</div>

<div class="login-wrapper">
    <div class="login-card" id="loginCard">

        <div class="logo-circle">
            <i class="fas fa-chart-line"></i>
        </div>
        <h2 class="login-title">HR Attrition AI</h2>
        <p class="login-subtitle">Enterprise Analytics Platform</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'info' }} alert-dismissible fade show mb-3" role="alert">
                        <i class="fas fa-{{ 'times-circle' if category == 'error' else 'check-circle' if category == 'success' else 'info-circle' }} me-2"></i>
                        {{ message }}
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm" onsubmit="showLoader()">
            <div class="input-group-custom">
                <i class="fas fa-user icon"></i>
                <input type="text" name="username" id="username" placeholder="Username" required autocomplete="username">
            </div>

            <div class="input-group-custom">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                <span class="toggle-password" onclick="togglePassword()">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </span>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember Me</label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText"><i class="fas fa-sign-in-alt me-2"></i>Sign In</span>
                <span id="loader" class="d-none">
                    <span class="spinner-border spinner-border-sm me-2"></span>Authenticating...
                </span>
            </button>
        </form>

        <div class="credentials-hint">
            <p><i class="fas fa-key me-1"></i> Demo Credentials</p>
            <div class="cred-item mb-1">
                <span>admin / admin123</span>
                <span class="badge-role badge-admin">Admin</span>
            </div>
            <div class="cred-item">
                <span>user / user123</span>
                <span class="badge-role badge-user">User</span>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

function showLoader() {
    document.getElementById('btnText').classList.add('d-none');
    document.getElementById('loader').classList.remove('d-none');
    document.getElementById('loginBtn').disabled = true;
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const icon = document.getElementById('themeIcon');
    icon.classList.toggle('fa-moon');
    icon.classList.toggle('fa-sun');
    localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
}

// Restore theme
if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
}

// Shake on error flash
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
{% if category == 'error' %}
document.getElementById('loginCard').classList.add('shake');
setTimeout(() => document.getElementById('loginCard').classList.remove('shake'), 600);
{% endif %}
{% endfor %}
{% endif %}
{% endwith %}

particlesJS('particles-js', {
    particles: {
        number: { value: 70, density: { enable: true, value_area: 800 } },
        color: { value: ['#667eea', '#764ba2', '#ffffff'] },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: true, anim: { enable: true, speed: 1, opacity_min: 0.1 } },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#667eea', opacity: 0.3, width: 1 },
        move: { enable: true, speed: 1.5, direction: 'none', random: true, out_mode: 'out' }
    },
    interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' } },
        modes: { grab: { distance: 140, line_linked: { opacity: 0.6 } }, push: { particles_nb: 3 } }
    }
});
</script>
</body>
</html>
