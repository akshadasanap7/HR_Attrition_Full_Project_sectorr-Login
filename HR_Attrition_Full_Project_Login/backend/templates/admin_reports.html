<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Reports - HR Attrition Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('admin_dashboard') }}">
                <i class="fas fa-chart-line me-2"></i>HR Analytics Reports
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    <i class="fas fa-user-shield me-1"></i>{{ username }}
                </span>
                <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('admin_dashboard') }}">
                    <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
                </a>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">
                    <i class="fas fa-sign-out-alt me-1"></i>Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Controls Panel -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-sliders-h me-2"></i>Chart Controls</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label for="chartType" class="form-label fw-semibold">Chart Type</label>
                                <select class="form-select" id="chartType">
                                    <option value="bar">Bar Chart</option>
                                    <option value="line">Line Chart</option>
                                    <option value="pie">Pie Chart</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="xColumn" class="form-label fw-semibold">X-Axis Column</label>
                                <select class="form-select" id="xColumn">
                                    <option value="">Select Column</option>
                                    {% for column in available_columns %}
                                        <option value="{{ column }}">{{ column }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="yColumn" class="form-label fw-semibold">Y-Axis Column</label>
                                <select class="form-select" id="yColumn">
                                    <option value="Attrition">Attrition</option>
                                    {% for column in available_columns %}
                                        {% if column != 'Attrition' %}
                                            <option value="{{ column }}">{{ column }}</option>
                                        {% endif %}
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="timeFrame" class="form-label fw-semibold">Time Frame</label>
                                <select class="form-select" id="timeFrame">
                                    <option value="all">All Data</option>
                                    <option value="monthly">Monthly</option>
                                    <option value="quarterly">Quarterly</option>
                                    <option value="yearly">Yearly</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-12">
                                <button class="btn btn-primary btn-lg" onclick="generateChart()">
                                    <i class="fas fa-chart-bar me-2"></i>Generate Chart
                                </button>
                                <button class="btn btn-success btn-lg ms-2" onclick="addChart()">
                                    <i class="fas fa-plus me-2"></i>Add New Chart
                                </button>
                                <button class="btn btn-warning btn-lg ms-2" onclick="clearAllCharts()">
                                    <i class="fas fa-trash me-2"></i>Clear All
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Container -->
        <div id="chartsContainer" class="row">
            <!-- Charts will be dynamically added here -->
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="text-center mt-4" style="display: none;">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted fw-semibold">Generating chart...</p>
        </div>

        <!-- No Data Message -->
        <div id="noDataMessage" class="text-center mt-5" style="display: none;">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <i class="fas fa-chart-bar text-muted mb-3" style="font-size: 4rem;"></i>
                    <h3 class="text-muted">No Charts Generated</h3>
                    <p class="text-muted">Select chart parameters and click "Generate Chart" to create visualizations.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let chartCounter = 0;
        let charts = {};

        // Show no data message initially
        document.getElementById('noDataMessage').style.display = 'block';

        function generateChart() {
            const chartType = document.getElementById('chartType').value;
            const xColumn = document.getElementById('xColumn').value;
            const yColumn = document.getElementById('yColumn').value;
            const timeFrame = document.getElementById('timeFrame').value;

            if (!xColumn) {
                alert('Please select an X-axis column');
                return;
            }

            // Show loading
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('noDataMessage').style.display = 'none';

            // Make API call
            fetch('/api/chart-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chart_type: chartType,
                    x_column: xColumn,
                    y_column: yColumn,
                    time_frame: timeFrame
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    createChartElement(data.chart_data, data.chart_type, xColumn, yColumn);
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                alert('Network error: ' + error.message);
            })
            .finally(() => {
                document.getElementById('loadingIndicator').style.display = 'none';
            });
        }

        function addChart() {
            generateChart();
        }

        function createChartElement(chartData, chartType, xColumn, yColumn) {
            chartCounter++;
            const chartId = `chart-${chartCounter}`;
            
            // Create chart container
            const chartContainer = document.createElement('div');
            chartContainer.className = 'col-lg-6 mb-4';
            chartContainer.innerHTML = `
                <div class="card shadow border-0">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="fas fa-chart-${chartType === 'pie' ? 'pie' : chartType === 'line' ? 'line' : 'bar'} me-2"></i>
                            ${xColumn} vs ${yColumn} (${chartType.charAt(0).toUpperCase() + chartType.slice(1)} Chart)
                        </h6>
                        <button class="btn btn-sm btn-outline-light" onclick="removeChart('${chartId}')">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <canvas id="${chartId}" width="400" height="200"></canvas>
                    </div>
                </div>
            `;

            document.getElementById('chartsContainer').appendChild(chartContainer);

            // Create chart
            const ctx = document.getElementById(chartId).getContext('2d');
            
            let chartConfig = {
                type: chartType,
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: `${xColumn} Analysis`
                        }
                    }
                }
            };

            // Add specific options for different chart types
            if (chartType === 'bar' || chartType === 'line') {
                chartConfig.options.scales = {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: yColumn === 'Attrition' ? 'Attrition Rate (%)' : yColumn
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: xColumn
                        }
                    }
                };

                // Add second y-axis if we have multiple datasets
                if (chartData.datasets.length > 1) {
                    chartConfig.options.scales.y1 = {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Count'
                        },
                        grid: {
                            drawOnChartArea: false,
                        },
                    };
                }
            }

            const chart = new Chart(ctx, chartConfig);
            charts[chartId] = chart;

            // Set canvas height
            document.getElementById(chartId).style.height = '300px';
        }

        function removeChart(chartId) {
            // Destroy chart instance
            if (charts[chartId]) {
                charts[chartId].destroy();
                delete charts[chartId];
            }
            
            // Remove DOM element
            const chartElement = document.getElementById(chartId);
            if (chartElement) {
                chartElement.closest('.col-lg-6').remove();
            }

            // Show no data message if no charts left
            if (Object.keys(charts).length === 0) {
                document.getElementById('noDataMessage').style.display = 'block';
            }
        }

        function clearAllCharts() {
            // Destroy all chart instances
            Object.keys(charts).forEach(chartId => {
                charts[chartId].destroy();
            });
            charts = {};
            
            // Clear container
            document.getElementById('chartsContainer').innerHTML = '';
            
            // Show no data message
            document.getElementById('noDataMessage').style.display = 'block';
            
            // Reset counter
            chartCounter = 0;
        }

        // Update Y-column options based on chart type
        document.getElementById('chartType').addEventListener('change', function() {
            const chartType = this.value;
            const yColumnSelect = document.getElementById('yColumn');
            
            if (chartType === 'pie') {
                // For pie charts, we don't need Y-column selection
                yColumnSelect.disabled = true;
                yColumnSelect.value = 'Attrition';
            } else {
                yColumnSelect.disabled = false;
            }
        });
    </script>
</body>
</html>
