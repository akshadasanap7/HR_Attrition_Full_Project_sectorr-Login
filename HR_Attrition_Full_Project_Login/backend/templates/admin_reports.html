<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Reports - HR Attrition AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background: var(--body-bg); }

        .chart-card {
            border-radius: var(--radius) !important;
            border: none !important;
            box-shadow: var(--shadow);
            transition: var(--transition);
            overflow: hidden;
        }

        .chart-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .chart-card .chart-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.88rem;
        }

        .chart-card canvas { max-height: 300px; }

        .controls-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 28px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .empty-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 2rem; color: #fff;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">
            <i class="fas fa-brain me-2"></i>HR Attrition AI
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="text-white-50 d-none d-md-block" style="font-size:0.85rem;">
                <i class="fas fa-user-shield me-1 text-white"></i>
                <span class="text-white fw-semibold">{{ username }}</span>
            </span>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('admin_dashboard') }}">
                <i class="fas fa-arrow-left me-1"></i>Dashboard
            </a>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">

    <!-- Page Header -->
    <div class="section-header mb-4">
        <div class="header-icon"><i class="fas fa-chart-bar"></i></div>
        <h2>Analytics Reports</h2>
    </div>

    <!-- Controls -->
    <div class="controls-card fade-in-up">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Chart Type</label>
                <select class="form-select" id="chartType">
                    <option value="bar">📊 Bar Chart</option>
                    <option value="line">📈 Line Chart</option>
                    <option value="pie">🥧 Pie Chart</option>
                    <option value="doughnut">🍩 Doughnut Chart</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">X-Axis Column</label>
                <select class="form-select" id="xColumn">
                    <option value="">— Select Column —</option>
                    {% for column in available_columns %}
                        <option value="{{ column }}">{{ column }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Y-Axis / Metric</label>
                <select class="form-select" id="yColumn">
                    <option value="Attrition">Attrition Rate</option>
                    {% for column in available_columns %}
                        {% if column != 'Attrition' %}
                            <option value="{{ column }}">{{ column }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <div class="d-flex gap-2">
                    <button class="btn btn-primary flex-fill" onclick="generateChart()">
                        <i class="fas fa-chart-bar me-1"></i>Generate
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="clearAllCharts()" title="Clear All">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loadingIndicator" class="text-center py-4" style="display:none;">
        <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
        <p class="mt-3 text-muted fw-semibold">Generating chart...</p>
    </div>

    <!-- Charts Grid -->
    <div id="chartsContainer" class="row g-4"></div>

    <!-- Empty State -->
    <div id="noDataMessage" class="empty-state fade-in-up">
        <div class="empty-icon"><i class="fas fa-chart-bar"></i></div>
        <h4 class="text-muted">No Charts Yet</h4>
        <p class="text-muted mb-0">Select a column and click <strong>Generate</strong> to create a chart.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let chartCounter = 0;
const charts = {};

const COLORS = [
    '#667eea','#764ba2','#11998e','#38ef7d',
    '#4facfe','#00f2fe','#f7971e','#ffd200',
    '#eb3349','#f45c43','#a18cd1','#fbc2eb'
];

document.getElementById('chartType').addEventListener('change', function() {
    const isPie = ['pie','doughnut'].includes(this.value);
    document.getElementById('yColumn').disabled = isPie;
    if (isPie) document.getElementById('yColumn').value = 'Attrition';
});

function generateChart() {
    const chartType = document.getElementById('chartType').value;
    const xColumn  = document.getElementById('xColumn').value;
    const yColumn  = document.getElementById('yColumn').value;

    if (!xColumn) {
        showToast('Please select an X-axis column', 'warning');
        return;
    }

    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('noDataMessage').style.display = 'none';

    const apiType = ['doughnut'].includes(chartType) ? 'pie' : chartType;

    fetch('/api/chart-data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chart_type: apiType, x_column: xColumn, y_column: yColumn })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            createChartElement(data.chart_data, chartType, xColumn, yColumn);
        } else {
            showToast('Error: ' + data.error, 'danger');
        }
    })
    .catch(err => showToast('Network error: ' + err.message, 'danger'))
    .finally(() => { document.getElementById('loadingIndicator').style.display = 'none'; });
}

function createChartElement(chartData, chartType, xColumn, yColumn) {
    chartCounter++;
    const id = `chart-${chartCounter}`;

    // Apply color palette
    if (chartData.datasets) {
        chartData.datasets.forEach((ds, i) => {
            if (['pie','doughnut'].includes(chartType)) {
                ds.backgroundColor = COLORS;
                ds.borderWidth = 2;
                ds.borderColor = '#fff';
            } else {
                ds.backgroundColor = COLORS[i % COLORS.length] + '99';
                ds.borderColor = COLORS[i % COLORS.length];
                ds.borderWidth = 2;
                ds.borderRadius = 6;
                ds.tension = 0.4;
                ds.fill = chartType === 'line' ? false : undefined;
                ds.pointBackgroundColor = COLORS[i % COLORS.length];
                ds.pointRadius = 4;
            }
        });
    }

    const col = document.createElement('div');
    col.className = 'col-xl-6 col-lg-6 fade-in-up';
    col.id = `col-${id}`;
    col.innerHTML = `
        <div class="chart-card">
            <div class="chart-header">
                <span><i class="fas fa-chart-${chartType==='pie'?'pie':chartType==='doughnut'?'pie':chartType==='line'?'line':'bar'} me-2"></i>${xColumn} — ${yColumn}</span>
                <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:8px;" onclick="removeChart('${id}')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="card-body p-3">
                <canvas id="${id}"></canvas>
            </div>
        </div>
    `;
    document.getElementById('chartsContainer').appendChild(col);

    const ctx = document.getElementById(id).getContext('2d');
    const isPie = ['pie','doughnut'].includes(chartType);

    const config = {
        type: chartType,
        data: chartData,
        options: {
            responsive: true,
            maintainAspectRatio: true,
            animation: { duration: 800, easing: 'easeInOutQuart' },
            plugins: {
                legend: { position: isPie ? 'right' : 'top', labels: { font: { family: 'Poppins', size: 11 }, padding: 12 } },
                title: { display: false }
            },
            scales: isPie ? {} : {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(0,0,0,0.05)' },
                    ticks: { font: { family: 'Poppins', size: 11 } }
                },
                x: {
                    grid: { display: false },
                    ticks: { font: { family: 'Poppins', size: 11 }, maxRotation: 45 }
                },
                ...(chartData.datasets && chartData.datasets.length > 1 ? {
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { family: 'Poppins', size: 11 } } }
                } : {})
            }
        }
    };

    charts[id] = new Chart(ctx, config);
}

function removeChart(id) {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
    const col = document.getElementById(`col-${id}`);
    if (col) col.remove();
    if (Object.keys(charts).length === 0) {
        document.getElementById('noDataMessage').style.display = 'block';
    }
}

function clearAllCharts() {
    Object.keys(charts).forEach(id => { charts[id].destroy(); delete charts[id]; });
    document.getElementById('chartsContainer').innerHTML = '';
    document.getElementById('noDataMessage').style.display = 'block';
    chartCounter = 0;
}

function showToast(msg, type) {
    const t = document.createElement('div');
    t.className = `alert alert-${type} fade-in-up`;
    t.style.cssText = 'position:fixed;top:80px;right:20px;z-index:9999;min-width:280px;box-shadow:0 8px 25px rgba(0,0,0,0.15);';
    t.innerHTML = `<i class="fas fa-info-circle me-2"></i>${msg}`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);
}
</script>
</body>
</html>
