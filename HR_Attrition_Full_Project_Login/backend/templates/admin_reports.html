<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Reports — HR Attrition AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">
            <div class="brand-icon"><i class="fas fa-brain"></i></div>
            HR Attrition AI
        </a>
        <div class="d-flex align-items-center gap-2">
            <div class="d-none d-md-flex align-items-center gap-2 me-2">
                <div style="width:32px;height:32px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;color:#fff;">
                    <i class="fas fa-user-shield"></i>
                </div>
                <span style="color:#fff;font-size:0.85rem;font-weight:600;">{{ username }}</span>
            </div>
            <button onclick="toggleTheme()" id="themeBtn" title="Toggle Theme" style="width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:all 0.3s;flex-shrink:0;">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('admin_dashboard') }}">
                <i class="fas fa-arrow-left me-1"></i>Dashboard
            </a>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </a>
        </div>
    </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center gap-3">
            <div style="width:52px;height:52px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;box-shadow:0 8px 25px rgba(102,126,234,0.4);">
                <i class="fas fa-chart-bar"></i>
            </div>
            <div>
                <h1>Analytics Reports</h1>
                <p>Visualize HR data with interactive charts</p>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid px-4 pb-5">

    <!-- Controls -->
    <div class="controls-card fade-in-up">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Chart Type</label>
                <select class="form-select" id="chartType">
                    <option value="bar">📊 Bar Chart</option>
                    <option value="line">📈 Line Chart</option>
                    <option value="pie">🥧 Pie Chart</option>
                    <option value="doughnut">🍩 Doughnut Chart</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">X-Axis Column</label>
                <select class="form-select" id="xColumn">
                    <option value="">— Select Column —</option>
                    {% for column in available_columns %}
                        <option value="{{ column }}">{{ column }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Y-Axis / Metric</label>
                <select class="form-select" id="yColumn">
                    <option value="Attrition">Attrition Rate</option>
                    {% for column in available_columns %}
                        {% if column != 'Attrition' %}
                            <option value="{{ column }}">{{ column }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <div class="d-flex gap-2">
                    <button class="btn btn-primary flex-fill" onclick="generateChart()">
                        <i class="fas fa-chart-bar me-1"></i>Generate
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="clearAllCharts()" title="Clear All">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loadingIndicator" class="text-center py-4" style="display:none;">
        <div class="spinner-border" style="color:var(--primary);width:3rem;height:3rem;"></div>
        <p class="mt-3" style="color:rgba(255,255,255,0.5);font-weight:500;">Generating chart...</p>
    </div>

    <!-- Charts Grid -->
    <div id="chartsContainer" class="row g-4"></div>

    <!-- Empty State -->
    <div id="noDataMessage" class="empty-state fade-in-up">
        <div class="empty-icon"><i class="fas fa-chart-bar"></i></div>
        <h4 style="color:rgba(255,255,255,0.4);">No Charts Yet</h4>
        <p style="color:rgba(255,255,255,0.25);margin:0;">Select a column and click <strong>Generate</strong> to create a chart.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let chartCounter = 0;
const charts = {};

const COLORS = [
    '#667eea','#764ba2','#11998e','#38ef7d',
    '#4facfe','#00f2fe','#f7971e','#ffd200',
    '#eb3349','#f45c43','#a18cd1','#fbc2eb'
];

document.getElementById('chartType').addEventListener('change', function() {
    const isPie = ['pie','doughnut'].includes(this.value);
    document.getElementById('yColumn').disabled = isPie;
    if (isPie) document.getElementById('yColumn').value = 'Attrition';
});

function generateChart() {
    const chartType = document.getElementById('chartType').value;
    const xColumn  = document.getElementById('xColumn').value;
    const yColumn  = document.getElementById('yColumn').value;

    if (!xColumn) { showToast('Please select an X-axis column', 'warning'); return; }

    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('noDataMessage').style.display = 'none';

    const apiType = ['doughnut'].includes(chartType) ? 'pie' : chartType;

    fetch('/api/chart-data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chart_type: apiType, x_column: xColumn, y_column: yColumn })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) createChartElement(data.chart_data, chartType, xColumn, yColumn);
        else showToast('Error: ' + data.error, 'danger');
    })
    .catch(err => showToast('Network error: ' + err.message, 'danger'))
    .finally(() => { document.getElementById('loadingIndicator').style.display = 'none'; });
}

function createChartElement(chartData, chartType, xColumn, yColumn) {
    chartCounter++;
    const id = `chart-${chartCounter}`;
    const isPie = ['pie','doughnut'].includes(chartType);

    if (chartData.datasets) {
        chartData.datasets.forEach((ds, i) => {
            if (isPie) {
                ds.backgroundColor = COLORS;
                ds.borderWidth = 2;
                ds.borderColor = '#12122a';
            } else {
                ds.backgroundColor = COLORS[i % COLORS.length] + '55';
                ds.borderColor = COLORS[i % COLORS.length];
                ds.borderWidth = 2;
                ds.borderRadius = 6;
                ds.tension = 0.4;
                ds.fill = false;
                ds.pointBackgroundColor = COLORS[i % COLORS.length];
                ds.pointRadius = 4;
                ds.pointHoverRadius = 6;
            }
        });
    }

    const col = document.createElement('div');
    col.className = 'col-xl-6 col-lg-6 fade-in-up';
    col.id = `col-${id}`;
    col.innerHTML = `
        <div class="chart-card">
            <div class="chart-header">
                <span><i class="fas fa-chart-${isPie?'pie':chartType==='line'?'line':'bar'} me-2"></i>${xColumn} — ${yColumn}</span>
                <button onclick="removeChart('${id}')" style="background:rgba(255,255,255,0.1);border:none;color:rgba(255,255,255,0.7);border-radius:6px;padding:3px 8px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='rgba(235,51,73,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div style="padding:16px;">
                <canvas id="${id}"></canvas>
            </div>
        </div>
    `;
    document.getElementById('chartsContainer').appendChild(col);

    Chart.defaults.color = 'rgba(255,255,255,0.5)';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';

    const ctx = document.getElementById(id).getContext('2d');
    charts[id] = new Chart(ctx, {
        type: chartType,
        data: chartData,
        options: {
            responsive: true,
            maintainAspectRatio: true,
            animation: { duration: 800, easing: 'easeInOutQuart' },
            plugins: {
                legend: {
                    position: isPie ? 'right' : 'top',
                    labels: { font: { family: 'Poppins', size: 11 }, padding: 12, color: 'rgba(255,255,255,0.6)' }
                }
            },
            scales: isPie ? {} : {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(255,255,255,0.04)' },
                    ticks: { font: { family: 'Poppins', size: 11 }, color: 'rgba(255,255,255,0.5)' }
                },
                x: {
                    grid: { display: false },
                    ticks: { font: { family: 'Poppins', size: 11 }, color: 'rgba(255,255,255,0.5)', maxRotation: 45 }
                },
                ...(chartData.datasets && chartData.datasets.length > 1 ? {
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { family: 'Poppins', size: 11 }, color: 'rgba(255,255,255,0.5)' } }
                } : {})
            }
        }
    });
}

function removeChart(id) {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
    const col = document.getElementById(`col-${id}`);
    if (col) col.remove();
    if (Object.keys(charts).length === 0) document.getElementById('noDataMessage').style.display = 'block';
}

function clearAllCharts() {
    Object.keys(charts).forEach(id => { charts[id].destroy(); delete charts[id]; });
    document.getElementById('chartsContainer').innerHTML = '';
    document.getElementById('noDataMessage').style.display = 'block';
    chartCounter = 0;
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const icon = document.getElementById('themeIcon');
    const isDark = !document.body.classList.contains('light-mode');
    icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('themeIcon').className = 'fas fa-sun';
}

function showToast(msg, type) {
    const t = document.createElement('div');
    t.className = `alert alert-${type} fade-in-up`;
    t.style.cssText = 'position:fixed;top:80px;right:20px;z-index:9999;min-width:280px;box-shadow:0 8px 25px rgba(0,0,0,0.4);';
    t.innerHTML = `<i class="fas fa-info-circle me-2"></i>${msg}`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);
}
</script>
</body>
</html>
